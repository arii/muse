<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c29">
  <title>Relay Yard | First person + aerial</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
  <main id="game" aria-label="Relay Yard arena">
    <canvas id="scene" aria-label="3D arena. Collect eight amber signals." tabindex="0"></canvas>
    <header class="hud">
      <div><h1>Relay Yard</h1><p id="mode" aria-live="polite">First person</p></div>
      <div class="actions"><p id="counter" aria-live="polite"><strong>0 / 8</strong><span>signals</span></p><button id="toggle" type="button">Aerial view <kbd>V</kbd></button></div>
    </header>
    <div id="crosshair" aria-hidden="true"></div>
    <p id="hint">Click the arena to look. WASD / arrows to move. Shift to sprint. V to see above.</p>
    <div id="touch-controls">
      <div id="joystick" aria-label="Movement joystick"><div id="stick"></div><span>MOVE</span></div>
      <div id="look-zone" aria-label="Drag to look"><span>DRAG TO LOOK</span></div>
    </div>
    <section id="win" hidden aria-labelledby="win-title">
      <p>8 / 8 SIGNALS</p><h2 id="win-title">Yard cleared.</h2>
      <p>Every signal collected.</p><button id="restart" type="button">Run again</button>
    </section>
    <p id="error" role="alert" hidden></p>
  </main>
  <script type="module" src="./game.mjs"></script>
</body>
</html>
