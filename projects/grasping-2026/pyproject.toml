[project]
name = "grasping-2026"
version = "0.1.0"
description = "2026 redo of a 2014 MS thesis: whole-arm grasping with VLM grounding"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",
    "numpy",
    "pillow",
    "requests",
]

[project.optional-dependencies]
rl = ["gymnasium==1.4.0", "stable-baselines3==2.9.0",
      "diffusers==0.42.1"]
test = ["pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["env*", "perception*", "planning*"]
