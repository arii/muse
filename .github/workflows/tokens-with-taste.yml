name: TokensWithTaste
on:
  push:
    paths:
      - 'projects/tokens-with-taste/**'
  pull_request:
    paths:
      - 'projects/tokens-with-taste/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/tokens-with-taste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[test]'
      - run: python -m pytest -v
