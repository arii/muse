name: TokensWithTaste
on:
  push:
    branches: [main]
    paths:
      - 'projects/tokens-with-taste/**'
      - '.github/workflows/tokens-with-taste.yml'
  pull_request:
    paths:
      - 'projects/tokens-with-taste/**'
      - '.github/workflows/tokens-with-taste.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/tokens-with-taste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: projects/tokens-with-taste/pyproject.toml
      - run: python -m pip install '.[test]'
      - run: python -m pytest -v
