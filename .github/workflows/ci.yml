name: ci
on:
  push:
    branches: [main]
    paths:
      - "projects/grasping-2026/**"
      - "writing-audit/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "projects/grasping-2026/**"
      - "writing-audit/**"
      - ".github/workflows/ci.yml"

jobs:
  slop-audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test code audit detectors
        run: python3 -m unittest discover -s writing-audit/scripts -p 'test_slop_audit.py' -v

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/grasping-2026
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (headless MuJoCo rendering)
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libglfw3 libgl1 libosmesa6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/grasping-2026/requirements.lock
      - name: Install locked deps (CPU torch first, mirrors Dockerfile)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1+cpu"
          pip install -r requirements.lock
          pip install --no-deps ".[test]"
      - name: Run tests
        run: pytest -v
        env:
          MUJOCO_GL: osmesa
