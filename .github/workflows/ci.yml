name: ci
on:
  push:
    branches: [main]
    paths:
      - "projects/grasping-2026/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "projects/grasping-2026/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/grasping-2026
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (headless MuJoCo rendering)
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libglfw3 libgl1 libosmesa6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + test deps
        run: pip install ".[test]"
      - name: Run tests
        run: pytest -v
        env:
          MUJOCO_GL: osmesa
