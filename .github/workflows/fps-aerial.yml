name: FPS aerial
on:
  push:
    branches: [main]
    paths:
      - 'projects/fps-aerial/**'
      - '.github/workflows/fps-aerial.yml'
  pull_request:
    paths:
      - 'projects/fps-aerial/**'
      - '.github/workflows/fps-aerial.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: projects/fps-aerial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
